[package]
name = "ghostroute"
version = "1.0.4"
description = "All-in-one HTTP request smuggling detection & exploitation tool"
authors = ["PwnedBytes0x1"]
edition = "2021"
license = "MIT"
repository = "https://github.com/PwnedBytes0x1/ghostroute"
homepage = "https://github.com/PwnedBytes0x1/ghostroute"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
rand = "0.8"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", features = ["http2"] }
httparse = "1"
semver = "1"
blake3 = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
colored = "2"
indicatif = "0.17"
h2 = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
mime_guess = "2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"
bytes = "1"

[build-dependencies]
built = { version = "0.7", features = ["git2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
