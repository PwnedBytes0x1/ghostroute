[package]
name = "ghostroute"
version = "2.0.0"
description = "All-in-one HTTP request smuggling detection & exploitation tool"
authors = ["PwnedBytes0x1"]
edition = "2021"
license = "MIT"
repository = "https://github.com/PwnedBytes0x1/ghostroute"
homepage = "https://github.com/PwnedBytes0x1/ghostroute"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
httparse = "1"
semver = "1"
blake3 = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
colored = "2"
h2 = "0.4"
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"
bytes = "1"

[build-dependencies]
built = { version = "0.7", features = ["git2"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
