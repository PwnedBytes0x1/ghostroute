version: '3.8'

services:
  haproxy:
    image: haproxy:3.0
    ports:
      - "8080:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - nginx
      - apache

  haproxy-cl0:
    image: haproxy:2.8
    ports:
      - "8081:80"
    volumes:
      - ./haproxy-cl0.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - nginx

  nginx:
    image: nginx:stable
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  nginx-mainline:
    image: nginx:mainline
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  apache:
    image: httpd:2.4
    ports:
      - "8084:80"
    volumes:
      - ./apache.conf:/usr/local/apache2/conf/httpd.conf

  caddy:
    image: caddy:latest
    ports:
      - "8085:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
