global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http-in
    bind *:80
    # Deliberately vulnerable to CL.0 — no body consumption
    option http-ignore-proxy-body
    default_backend servers

backend servers
    server nginx1 nginx:80 maxconn 32
